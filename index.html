<style>
/* ApplexDrop: the Paid interface, 1:1 in structure and tokens, for Apple Pay. */
:root {
  --bg: #0a0a0a; --card: #1a1a1a; --card2: #141414; --border: #1f2228; --hover: rgba(31, 34, 40, .55);
  --fg: #f7f9f9; --fg7: rgba(247, 249, 249, .7); --fg45: rgba(247, 249, 249, .45); --muted: #71767b; --line: rgba(255, 255, 255, .06); --line2: rgba(255, 255, 255, .1);
  --ok: #00ba7c; --warn: #ffd236; --bad: #f4212e; --blue: #1d9bf0;
  --sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --mono: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --rail: 275px; color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.4 var(--sans); font-optical-sizing: auto; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
a { color: inherit; text-decoration: none; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
img { display: block; }
svg { display: block; }
.mono { font-family: var(--mono); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
::selection { background: rgba(29, 155, 240, .35); }

/* ---------------------------------------------------------------- shell: left rail + main */
.shell { display: flex; min-height: 100svh; }
.rail { position: sticky; top: 0; z-index: 60; height: 100svh; flex: none; width: var(--rail); transition: width .2s; }
.rail-in { position: absolute; inset: 0 auto 0 0; width: var(--rail); display: flex; flex-direction: column; justify-content: space-between; padding: 0 12px 12px; border-right: 1px solid var(--border); background: var(--bg); overflow: hidden auto; transition: width .2s; }
.rail-logo { display: flex; align-items: center; height: 64px; width: fit-content; padding: 0 9px; border-radius: 999px; }
.rail-logo img { height: 30px; width: auto; }
.nav { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.nav a { display: flex; align-items: center; gap: 20px; width: fit-content; padding: 12px; border-radius: 999px; color: var(--fg7); transition: background .15s, color .15s; }
.nav a:hover { background: var(--hover); color: var(--fg); }
.nav a svg { width: 26px; height: 26px; flex: none; }
.nav a span { font-size: 20px; line-height: 26px; white-space: nowrap; }
.nav a.on { color: var(--fg); }
.nav a.on span { font-weight: 700; }
.acct { display: flex; align-items: center; gap: 12px; width: 100%; padding: 12px; margin-bottom: 8px; border-radius: 999px; transition: background .15s; }
.acct:hover { background: var(--hover); }
.acct .av { width: 40px; height: 40px; border-radius: 50%; background: var(--card); box-shadow: inset 0 0 0 1px var(--border); display: grid; place-items: center; flex: none; }
.acct .av img { height: 19px; }
.acct b { display: block; font-size: 14px; }
.acct small { display: block; font-size: 14px; color: var(--muted); }
.acct .x { margin-left: auto; color: var(--muted); width: 18px; height: 18px; flex: none; }
.acct > span { min-width: 0; overflow: hidden; }
.collapse { position: absolute; top: 16px; left: var(--rail); transform: translateX(-50%); width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--border); background: var(--bg); color: var(--muted); display: grid; place-items: center; z-index: 2; transition: left .2s, background .15s, color .15s; }
.collapse:hover { background: var(--card); color: var(--fg); }
.collapse svg { width: 16px; height: 16px; transition: transform .2s; }
.rail.mini { --rail: 80px; }
.rail.mini .nav a span, .rail.mini .acct > span, .rail.mini .acct .x { display: none; }
.rail.mini .collapse svg { transform: rotate(180deg); }
.main { flex: 1; min-width: 0; }

/* ---------------------------------------------------------------- top bar */
.top { position: sticky; top: 0; z-index: 50; height: 64px; background: rgba(10, 10, 10, .82); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); border-bottom: 1px solid var(--border); }
.top nav { display: flex; align-items: center; gap: 16px; height: 64px; padding: 0 24px; }
.top .mlogo { display: none; }
.top .mlogo img { height: 26px; }
.search { flex: 1; display: flex; justify-content: center; min-width: 0; }
.search-box { position: relative; width: 100%; max-width: 560px; }
.search-in { display: flex; align-items: center; height: 44px; border-radius: 999px; border: 1px solid var(--border); background: var(--bg); transition: border-color .15s; }
.search-in:focus-within { border-color: var(--blue); }
.search-in svg { width: 16px; height: 16px; color: var(--muted); margin: 0 4px 0 14px; flex: none; }
.search-in input { flex: 1; min-width: 0; height: 40px; border: 0; outline: 0; background: transparent; padding: 0 16px 0 4px; font-size: 14px; caret-color: var(--blue); }
.search-in input::placeholder { color: var(--muted); }
.typeahead { position: absolute; left: 0; right: 0; top: 50px; background: var(--bg); border: 1px solid var(--border); border-radius: 16px; box-shadow: 0 0 15px rgba(255, 255, 255, .12), 0 0 3px 1px rgba(255, 255, 255, .08); padding: 6px 0; display: none; max-height: 60vh; overflow: auto; }
.typeahead.on { display: block; }
.typeahead a, .typeahead p { display: flex; align-items: center; gap: 12px; padding: 10px 16px; margin: 0; font-size: 14px; }
.typeahead a:hover, .typeahead a.sel { background: var(--hover); }
.typeahead img, .typeahead .ini { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; flex: none; }
.typeahead small { color: var(--muted); display: block; font-size: 13px; }
.typeahead p { color: var(--muted); }
.acts { margin-left: auto; display: flex; align-items: center; gap: 8px; flex: none; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 999px; font-size: 14px; font-weight: 500; white-space: nowrap; transition: background .15s, border-color .15s, opacity .15s; }
.btn[disabled], .btn.dim { opacity: .5; pointer-events: none; }
.btn-w { background: var(--fg); color: #0f1419; padding: 8px 16px; }
.btn-w:hover { background: #d7dbdc; }
.btn-o { border: 1px solid rgba(247, 249, 249, .12); color: var(--fg); height: 36px; padding: 0 16px; font-size: 13px; }
.btn-o:hover { background: var(--card); }
.btn-l { padding: 12px 20px; }
.btn-line { border: 1px solid var(--border); padding: 12px 20px; }
.btn-line:hover { background: var(--card); }
.wallet-btn img { width: 18px; height: 18px; border-radius: 5px; }
.menu-btn { display: none; width: 36px; height: 36px; border-radius: 50%; place-items: center; }
.menu-btn:hover { background: var(--card); }
.menu-btn svg { width: 22px; height: 22px; }

/* ---------------------------------------------------------------- page frame */
.wrap { width: 100%; max-width: 1280px; margin: 0 auto; padding: 0 24px; }
.view { padding-bottom: 96px; min-height: calc(100svh - 64px); }
.page-h { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 28px 0 18px; flex-wrap: wrap; }
.page-h h1 { margin: 0; font-size: 28px; font-weight: 600; letter-spacing: -.02em; }
.page-h p { margin: 6px 0 0; color: var(--fg45); font-size: 15px; max-width: 640px; }
.h2 { margin: 0; font-size: 24px; font-weight: 500; letter-spacing: -.02em; display: flex; align-items: center; gap: 8px; }
.fade { animation: fadeUp .5s cubic-bezier(.2, .7, .2, 1) both; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.cardin { animation: cardIn .6s cubic-bezier(.2, .7, .2, 1) both; }
@keyframes cardIn { from { opacity: 0; transform: translateY(14px) scale(.99); } to { opacity: 1; transform: none; } }

/* ---------------------------------------------------------------- home hero */
.hero { padding: 48px 0 0; }
.hero-in { max-width: 1024px; margin: 0 auto 80px; text-align: center; }
.hero h1 { margin: 0; font-size: 60px; font-weight: 500; line-height: 1.05; letter-spacing: -.035em; white-space: nowrap; }
.hero h1 .w { display: inline-block; animation: fadeUp .6s cubic-bezier(.2, .7, .2, 1) both; }
.hero h1 .ap { display: inline-flex; align-items: baseline; gap: .02em; }
.hero h1 .ap svg { width: .74em; height: .88em; align-self: center; transform: translateY(-.06em); }
.hero p { margin: 20px auto 0; max-width: 672px; font-size: 18px; line-height: 1.6; color: var(--fg45); text-wrap: balance; }
.hero .cta { margin-top: 36px; display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; }

/* ---------------------------------------------------------------- feature cards */
.tiles { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px; }
.tile { position: relative; isolation: isolate; overflow: hidden; display: flex; flex-direction: column; border-radius: 16px; border: 1px solid var(--line); background: var(--card); height: 280px; transition: border-color .2s, box-shadow .2s; }
.tile:hover { border-color: rgba(255, 255, 255, .2); box-shadow: 0 10px 30px rgba(255, 255, 255, .03); }
.tile.s3 { grid-column: span 3; } .tile.s2 { grid-column: span 2; } .tile.s6 { grid-column: span 6; height: auto; }
.tile-art { position: absolute; inset: 0; overflow: hidden; }
.tile-foot { position: relative; z-index: 3; margin-top: auto; display: flex; justify-content: space-between; align-items: center; padding: 16px; font-size: 15px; background: linear-gradient(to top, var(--card) 35%, rgba(26, 26, 26, 0)); }
.tile-foot span:last-child { color: var(--fg7); transition: color .15s; }
.tile:hover .tile-foot span:last-child { color: var(--fg); }
/* explore art: tiles panning diagonally */
.pan { position: absolute; left: -6%; top: -12%; display: grid; grid-template-columns: repeat(4, 140px); gap: 12px; transform: rotate(0deg); animation: pan 38s linear infinite alternate; }
@keyframes pan { from { transform: translate(0, 0); } to { transform: translate(-120px, -150px); } }
.mini-t { width: 140px; border-radius: 10px; background: var(--card2); border: 1px solid var(--line); padding: 6px; }
.mini-t .im { aspect-ratio: 1; border-radius: 7px; background: #222; overflow: hidden; position: relative; }
.mini-t .im img { width: 100%; height: 100%; object-fit: cover; }
.mini-t .im .chip { position: absolute; left: 6px; bottom: 6px; }
.mini-t p { margin: 7px 2px 2px; font-size: 11px; font-weight: 700; display: flex; gap: 5px; align-items: baseline; white-space: nowrap; overflow: hidden; }
.mini-t p small { color: var(--muted); font-weight: 400; font-size: 9px; }
.sk { background: linear-gradient(100deg, #1c1c1c 20%, #262626 40%, #1c1c1c 60%); background-size: 200% 100%; animation: sk 2.4s ease-in-out infinite; }
@keyframes sk { from { background-position: 150% 0; } to { background-position: -50% 0; } }
.sk-line { height: 8px; border-radius: 4px; margin: 8px 2px 2px; width: 70%; }
/* payments art */
.payrows { position: absolute; inset: 18px 28px auto; display: flex; flex-direction: column; gap: 10px; }
.payrow { display: flex; align-items: center; gap: 12px; height: 60px; padding: 0 14px; border-radius: 12px; background: var(--card2); border: 1px solid var(--line); box-shadow: 0 6px 18px rgba(0, 0, 0, .35); }
.payrow .l b { display: block; font-size: 19px; font-weight: 500; letter-spacing: -.01em; line-height: 1.05; }
.payrow .l small { display: block; font-size: 13px; font-weight: 600; }
.payrow .pair { display: flex; align-items: center; gap: 10px; margin-left: auto; margin-right: auto; color: var(--muted); }
.payrow .pair svg.sw { width: 16px; height: 16px; }
.payrow .st { font-size: 11px; color: var(--fg45); font-weight: 600; min-width: 84px; text-align: right; }
.payrow .st.ok { color: var(--ok); }
.coin-dot { width: 30px; height: 30px; border-radius: 50%; background: #2a2a2a; overflow: hidden; flex: none; box-shadow: 0 0 0 2px var(--card2); }
.coin-dot img { width: 100%; height: 100%; object-fit: cover; }
.applepay { display: inline-flex; align-items: center; gap: 1px; height: 22px; padding: 0 6px 0 5px; border-radius: 5px; background: #fff; color: #000; font: 600 12px/1 var(--sans); letter-spacing: -.01em; flex: none; }
.applepay svg { width: 10px; height: 12px; margin-top: -2px; }
.applepay.lg { height: 30px; padding: 0 9px 0 7px; font-size: 16px; border-radius: 7px; }
.applepay.lg svg { width: 13px; height: 16px; }
.applepay.xs { height: 16px; font-size: 9px; padding: 0 4px 0 3px; border-radius: 4px; }
.applepay.xs svg { width: 8px; height: 9px; margin-top: -1px; }
.applepay.dark { background: #000; color: #fff; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .25); }
/* analytics art */
.an { position: absolute; inset: 0; padding: 22px 20px; }
.an small { font-size: 12px; color: var(--fg7); display: flex; justify-content: space-between; }
.an b { display: block; margin-top: 4px; font-size: 32px; font-weight: 500; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.an svg { position: absolute; left: 0; right: 0; bottom: 48px; width: 100%; height: 110px; }
/* launch art */
.la { position: absolute; inset: 0; padding: 22px 20px; }
.la .lbl { font: 500 11px/1 var(--mono); letter-spacing: .12em; color: var(--fg45); text-transform: uppercase; }
.route-in { margin-top: 16px; display: flex; align-items: center; gap: 10px; height: 44px; border-radius: 999px; border: 2px solid var(--fg); padding: 0 6px 0 14px; background: var(--bg); box-shadow: 0 0 0 4px rgba(247, 249, 249, .06); }
.route-in input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font-size: 14px; }
.route-in input::placeholder { color: var(--muted); }
.route-in button { width: 30px; height: 30px; border-radius: 50%; background: var(--fg); color: #000; display: grid; place-items: center; flex: none; }
.route-in button svg { width: 15px; height: 15px; }
.la p { margin: 14px 2px 0; font-size: 13px; color: var(--fg45); line-height: 1.5; }
/* docs art */
.dc { position: absolute; inset: 0; padding: 18px 20px; font: 12px/1.55 var(--mono); color: var(--fg45); -webkit-mask: linear-gradient(to bottom, transparent, #000 18%, #000 70%, transparent); mask: linear-gradient(to bottom, transparent, #000 18%, #000 70%, transparent); }
.dc .k { color: var(--fg45); letter-spacing: .1em; font-size: 11px; margin: 14px 0 6px; }
.dc .h { color: var(--fg); font: 600 14px/1.3 var(--sans); margin-bottom: 4px; }
.dc p { margin: 0; font-family: var(--sans); font-size: 12.5px; }
/* siri strip */
.siri-strip { display: flex; align-items: center; gap: 20px; padding: 22px 24px; }
.siri-strip .orb { width: 54px; height: 54px; border-radius: 50%; flex: none; background: conic-gradient(from 200deg, #ff5ec4, #8b5cf6, #22d3ee, #34d399, #fbbf24, #ff5ec4); filter: saturate(1.1); position: relative; animation: spin 7s linear infinite; }
.siri-strip .orb::after { content: ""; position: absolute; inset: 3px; border-radius: 50%; background: radial-gradient(circle at 40% 35%, rgba(255, 255, 255, .85), rgba(255, 255, 255, .15) 45%, rgba(10, 10, 10, .2) 70%); }
@keyframes spin { to { transform: rotate(360deg); } }
.siri-strip h3 { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: -.02em; }
.siri-strip p { margin: 3px 0 0; color: var(--fg45); font-size: 14px; }
.siri-strip .go { margin-left: auto; }

/* ---------------------------------------------------------------- top tokens + profiles */
.board { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px 40px; margin-top: 64px; }
.board-h { display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 32px; }
.board-h .l { display: flex; align-items: center; gap: 10px 16px; min-width: 0; flex-wrap: wrap; }
.board .h2 { white-space: nowrap; }
.chips { display: flex; gap: 6px; }
.chipb { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px 0 4px; border-radius: 999px; border: 1px solid rgba(255, 255, 255, .1); background: rgba(255, 255, 255, .04); font-size: 12px; font-weight: 500; color: var(--fg7); }
.chipb img, .chipb svg { width: 16px; height: 16px; border-radius: 4px; }
.chipb.on { border-color: rgba(255, 255, 255, .4); background: rgba(255, 255, 255, .12); color: var(--fg); }
.pager { display: flex; align-items: center; gap: 4px; font: 12px var(--mono); color: var(--fg7); }
.pager button { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; color: var(--fg7); }
.pager button:hover { background: rgba(255, 255, 255, .06); color: var(--fg); }
.pager button[disabled] { opacity: .3; pointer-events: none; }
.pager button svg { width: 16px; height: 16px; }
.pager span { min-width: 44px; text-align: center; }
.tgrid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; align-items: start; align-content: start; align-self: start; }
.profs, .plist { align-self: start; }
.tok { display: block; border-radius: 14px; border: 1px solid var(--line); background: var(--card); padding: 8px; transition: border-color .2s, transform .2s; }
.tok:hover { border-color: rgba(255, 255, 255, .2); }
.tok .im { position: relative; aspect-ratio: 1; border-radius: 10px; overflow: hidden; background: #222; border: 1px solid var(--line); }
.tok .im img.c { width: 100%; height: 100%; object-fit: cover; transition: transform .4s; }
.tok:hover .im img.c { transform: scale(1.04); }
.tok .age { position: absolute; top: 8px; right: 8px; font: 500 10px var(--mono); padding: 3px 7px; border-radius: 999px; background: rgba(0, 0, 0, .55); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); color: var(--fg7); }
.tok .to { position: absolute; left: 8px; bottom: 8px; right: 8px; display: flex; }
.who { display: inline-flex; align-items: center; gap: 6px; max-width: 100%; height: 30px; padding: 0 10px 0 4px; border-radius: 999px; background: rgba(10, 10, 10, .72); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); border: 1px solid rgba(255, 255, 255, .08); font-size: 12px; font-weight: 700; white-space: nowrap; }
.who .applepay { height: 20px; font-size: 11px; padding: 0 5px 0 4px; }
.who span { overflow: hidden; text-overflow: ellipsis; }
.tok .meta { padding: 12px 6px 6px; }
.tok .nm { display: flex; align-items: baseline; gap: 8px; font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; }
.tok .nm span { overflow: hidden; text-overflow: ellipsis; }
.tok .nm small { font: 500 10.5px var(--mono); color: var(--muted); text-transform: uppercase; flex: none; }
.tok .mc { margin-top: 4px; font-size: 16px; font-weight: 700; letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
.tok .mc small { font: 500 10.5px var(--mono); color: var(--muted); margin-left: 4px; }
.tok.first { align-self: stretch; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; text-align: center; min-height: 100%; border-style: dashed; border-color: rgba(255, 255, 255, .14); padding: 20px; color: var(--fg7); font-size: 14px; }
.tok.first .plus { width: 44px; height: 44px; border-radius: 50%; background: var(--fg); color: #000; display: grid; place-items: center; }
.tok.first .plus svg { width: 20px; height: 20px; }
.tok.ghost .im { border: 0; }
.profs { display: flex; flex-direction: column; gap: 16px; }
.prof { display: block; border-radius: 14px; border: 1px solid var(--line); background: var(--card); overflow: hidden; transition: border-color .2s; }
.prof:hover { border-color: rgba(255, 255, 255, .2); }
.prof .bn { height: 110px; background: radial-gradient(120% 140% at 85% 0%, #3a3a3c 0%, #1f1f21 55%, #161616 100%); position: relative; }
.prof .bn::after { content: ""; position: absolute; inset: 0; background: radial-gradient(circle at 1px 1px, rgba(255, 255, 255, .13) 1px, transparent 1.3px) 0 0 / 9px 9px; -webkit-mask: radial-gradient(70% 120% at 90% 10%, #000, transparent); mask: radial-gradient(70% 120% at 90% 10%, #000, transparent); }
.prof .bd { padding: 0 16px 14px; }
.ini { display: grid; place-items: center; border-radius: 50%; background: linear-gradient(180deg, #a5abb8, #858a96); color: #fff; font-weight: 600; letter-spacing: .02em; flex: none; }
.prof .ini { width: 68px; height: 68px; font-size: 26px; margin-top: -36px; position: relative; box-shadow: 0 0 0 4px var(--card); }
.prof h4 { margin: 8px 0 0; font-size: 18px; font-weight: 700; letter-spacing: -.01em; }
.prof .hd { color: var(--muted); font-size: 15px; }
.tagp { display: inline-flex; align-items: center; gap: 5px; margin-top: 4px; padding: 2px 8px; border-radius: 5px; background: rgba(255, 255, 255, .06); color: var(--fg45); font-size: 12px; }
.tagp svg { width: 12px; height: 12px; }
.prof .nums { display: flex; align-items: baseline; gap: 18px; margin-top: 6px; font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; }
.prof .nums small { font-weight: 400; color: var(--muted); font-size: 14px; margin-left: 4px; }
.prof .rec { text-align: right; font-size: 11px; color: var(--fg45); margin-top: 2px; }
.empty-card { border-radius: 14px; border: 1px dashed rgba(255, 255, 255, .14); padding: 22px; color: var(--fg45); font-size: 14px; line-height: 1.55; }
.empty-card b { color: var(--fg); display: block; font-size: 15px; margin-bottom: 4px; }
/* payments lists */
.plist { display: flex; flex-direction: column; gap: 10px; }
.prow { display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 14px; border: 1px solid var(--line); background: var(--card); }
.prow .amt b { display: block; font-size: 26px; font-weight: 500; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.prow .amt span { color: var(--fg45); font-size: 15px; }
.prow .amt span b { display: inline; font-size: 15px; color: var(--fg); font-weight: 700; letter-spacing: 0; }
.prow .r { margin-left: auto; text-align: right; color: var(--fg45); font: 12px var(--mono); }
.prow .ini { width: 40px; height: 40px; font-size: 15px; }

/* ---------------------------------------------------------------- forms, dialogs */
.panel { border-radius: 16px; border: 1px solid var(--line); background: var(--card); padding: 22px; }
.panel h3 { margin: 0 0 4px; font-size: 18px; font-weight: 600; letter-spacing: -.01em; }
.panel .sub { margin: 0 0 18px; color: var(--fg45); font-size: 14px; line-height: 1.5; }
.field { display: block; margin-bottom: 16px; }
.field > span { display: flex; justify-content: space-between; font-size: 13px; color: var(--fg7); margin-bottom: 7px; font-weight: 500; }
.field > span small { color: var(--muted); font-weight: 400; }
.inp { width: 100%; height: 46px; border-radius: 12px; border: 1px solid var(--border); background: var(--bg); padding: 0 14px; outline: 0; font-size: 15px; transition: border-color .15s, box-shadow .15s; }
textarea.inp { height: 92px; padding: 12px 14px; resize: vertical; line-height: 1.45; }
.inp:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(29, 155, 240, .18); }
.inp::placeholder { color: #50555b; }
.field.err .inp, .field.err .drop { border-color: var(--bad); }
.field .msg { display: none; color: #ff6b74; font-size: 12.5px; margin-top: 6px; }
.field.err .msg { display: block; }
.inp-pre { position: relative; }
.inp-pre .p { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; font-size: 15px; }
.inp-pre .inp { padding-left: 30px; }
.inp-pre .s { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); font: 12px var(--mono); pointer-events: none; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.row3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.drop { display: flex; align-items: center; gap: 16px; padding: 14px; border-radius: 14px; border: 1px dashed rgba(255, 255, 255, .18); background: var(--bg); cursor: pointer; transition: border-color .15s, background .15s; }
.drop:hover, .drop.over { border-color: var(--fg7); background: #0f0f0f; }
.drop .pv { width: 84px; height: 84px; border-radius: 12px; background: var(--card); display: grid; place-items: center; overflow: hidden; flex: none; color: var(--muted); }
.drop .pv img { width: 100%; height: 100%; object-fit: cover; }
.drop .pv svg { width: 26px; height: 26px; }
.drop b { display: block; font-size: 15px; font-weight: 600; }
.drop small { display: block; color: var(--muted); font-size: 13px; margin-top: 3px; }
.drop input { display: none; }
.routebox { border-radius: 14px; border: 1px solid rgba(255, 255, 255, .1); background: linear-gradient(180deg, #161616, #121212); padding: 16px; margin-bottom: 16px; }
.routebox .hd { display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 600; margin-bottom: 12px; }
.routebox .hd .applepay { margin-left: auto; }
.routebox .field { margin-bottom: 12px; }
.routebox .note { font-size: 12.5px; color: var(--muted); line-height: 1.5; display: flex; gap: 8px; }
.routebox .note svg { width: 14px; height: 14px; flex: none; margin-top: 2px; }
.siri-tag { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--fg7); padding: 4px 10px 4px 4px; border-radius: 999px; background: rgba(255, 255, 255, .06); margin-bottom: 14px; }
.siri-tag i { width: 18px; height: 18px; border-radius: 50%; background: conic-gradient(from 200deg, #ff5ec4, #8b5cf6, #22d3ee, #34d399, #fbbf24, #ff5ec4); }
.more { display: flex; align-items: center; gap: 8px; color: var(--fg7); font-size: 14px; padding: 6px 0 14px; }
.more svg { width: 14px; height: 14px; transition: transform .2s; }
.more.on svg { transform: rotate(90deg); }
.socials { display: none; }
.socials.on { display: block; }
.totals { border-radius: 12px; background: var(--bg); border: 1px solid var(--border); padding: 12px 14px; font-size: 13.5px; margin-bottom: 16px; }
.totals div { display: flex; justify-content: space-between; padding: 3px 0; color: var(--fg7); }
.totals div b { color: var(--fg); font-weight: 600; font-variant-numeric: tabular-nums; }
.totals div.t { border-top: 1px solid var(--border); margin-top: 6px; padding-top: 9px; color: var(--fg); font-weight: 600; }
.formerr { display: none; border-radius: 12px; border: 1px solid rgba(244, 33, 46, .35); background: rgba(244, 33, 46, .08); color: #ffb3b8; padding: 11px 14px; font-size: 13.5px; margin-bottom: 14px; line-height: 1.45; }
.formerr.on { display: block; }
.formerr a { text-decoration: underline; margin-right: 12px; }
.wide { width: 100%; height: 50px; font-size: 15px; font-weight: 600; }
.launch-grid { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 24px; align-items: start; }
.sticky { position: sticky; top: 88px; }
.preview .tok { pointer-events: none; }
.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
.steps li { display: flex; gap: 12px; align-items: flex-start; color: var(--muted); font-size: 14px; }
.steps li i { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid #3a3d42; flex: none; display: grid; place-items: center; margin-top: -1px; }
.steps li.on { color: var(--fg); }
.steps li.on i { border-color: var(--fg); border-top-color: transparent; animation: spin .8s linear infinite; }
.steps li.ok { color: var(--fg7); }
.steps li.ok i { border-color: var(--ok); background: var(--ok); }
.steps li.ok i::after { content: ""; width: 9px; height: 5px; border-left: 2px solid #000; border-bottom: 2px solid #000; transform: rotate(-45deg) translate(1px, -1px); }
.steps li small { display: block; color: var(--muted); font-size: 12.5px; margin-top: 2px; word-break: break-all; }
.done-card { text-align: center; padding: 10px 0 0; }
.done-card .tok { max-width: 240px; margin: 0 auto 18px; text-align: left; }
.done-card h3 { font-size: 24px; margin: 0 0 6px; letter-spacing: -.02em; }
.done-card p { color: var(--fg45); margin: 0 0 18px; }
.done-card .cta { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.copy { display: inline-flex; align-items: center; gap: 8px; max-width: 100%; height: 34px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--border); font: 12.5px var(--mono); color: var(--fg7); }
.copy:hover { background: var(--card); color: var(--fg); }
.copy span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.copy svg { width: 14px; height: 14px; flex: none; }
/* modal */
.modal { position: fixed; inset: 0; z-index: 100; display: none; align-items: center; justify-content: center; padding: 16px; background: rgba(91, 112, 131, .4); }
.modal.on { display: flex; animation: fadeIn .15s both; }
@keyframes fadeIn { from { opacity: 0; } }
.modal-in { width: 100%; max-width: 420px; max-height: calc(100svh - 32px); overflow: auto; border-radius: 16px; background: var(--bg); box-shadow: 0 0 15px rgba(255, 255, 255, .12), 0 0 3px 1px rgba(255, 255, 255, .08); padding: 22px; animation: cardIn .25s both; }
.modal-in h3 { margin: 0 0 4px; font-size: 20px; font-weight: 700; }
.modal-in .sub { color: var(--muted); font-size: 14px; margin: 0 0 18px; }
.wlist { display: flex; flex-direction: column; gap: 8px; }
.wlist button, .wlist a { display: flex; align-items: center; gap: 14px; width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--border); font-size: 15px; font-weight: 600; text-align: left; transition: background .15s; }
.wlist button:hover, .wlist a:hover { background: var(--card); }
.wlist img { width: 32px; height: 32px; border-radius: 8px; }
.wlist small { margin-left: auto; color: var(--muted); font-weight: 400; font-size: 12px; }
.x-close { float: right; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; margin: -6px -6px 0 0; color: var(--fg7); }
.x-close:hover { background: var(--card); }
.x-close svg { width: 18px; height: 18px; }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px); z-index: 120; background: var(--blue); color: #fff; padding: 11px 18px; border-radius: 8px; font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; max-width: calc(100vw - 32px); }
.toast.on { opacity: 1; transform: translate(-50%, 0); }
/* mobile menu */
.mmenu { position: fixed; inset: 0; z-index: 90; display: none; background: rgba(0, 0, 0, .6); }
.mmenu.on { display: block; }
.mmenu-in { position: absolute; top: 0; bottom: 0; left: 0; width: min(300px, 86vw); background: var(--bg); border-right: 1px solid var(--border); padding: 8px 12px 16px; display: flex; flex-direction: column; animation: slideIn .2s both; overflow: auto; }
@keyframes slideIn { from { transform: translateX(-100%); } }
.mmenu .nav a { width: 100%; }

/* ---------------------------------------------------------------- inner pages */
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 16px; }
.kpi { border-radius: 16px; border: 1px solid var(--line); background: var(--card); padding: 18px 18px 16px; }
.kpi small { display: block; font-size: 12px; color: var(--fg7); }
.kpi b { display: block; font-size: 30px; font-weight: 500; letter-spacing: -.02em; margin-top: 6px; font-variant-numeric: tabular-nums; }
.kpi span { display: block; font-size: 12px; color: var(--muted); margin-top: 2px; }
.bars { display: flex; align-items: flex-end; gap: 6px; height: 180px; padding-top: 10px; }
.bars div { flex: 1; border-radius: 6px 6px 2px 2px; background: linear-gradient(180deg, #f7f9f9, #9aa0a6); min-height: 3px; opacity: .85; position: relative; }
.bars div:hover { opacity: 1; }
.bars-x { display: flex; gap: 6px; margin-top: 8px; font: 10px var(--mono); color: var(--muted); }
.bars-x span { flex: 1; text-align: center; overflow: hidden; }
.docs { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 40px; }
.toc { position: sticky; top: 88px; align-self: start; display: flex; flex-direction: column; gap: 2px; }
.toc a { padding: 7px 12px; border-radius: 8px; color: var(--fg7); font-size: 14px; }
.toc a:hover { background: var(--hover); color: var(--fg); }
.doc h2 { font-size: 24px; font-weight: 600; letter-spacing: -.02em; margin: 34px 0 10px; scroll-margin-top: 90px; }
.doc h2:first-child { margin-top: 6px; }
.doc p, .doc li { color: var(--fg7); font-size: 15.5px; line-height: 1.65; }
.doc ul { padding-left: 20px; }
.doc code { font: 13px var(--mono); background: var(--card); border: 1px solid var(--line); padding: 1px 6px; border-radius: 6px; color: var(--fg); }
.doc table { width: 100%; border-collapse: collapse; font-size: 14px; margin: 8px 0 16px; }
.doc td, .doc th { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--border); color: var(--fg7); }
.doc th { font: 500 11px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.coin-head { display: flex; gap: 22px; align-items: center; padding: 28px 0 22px; flex-wrap: wrap; }
.coin-head .lg { width: 112px; height: 112px; border-radius: 18px; overflow: hidden; background: #222; flex: none; border: 1px solid var(--line); }
.coin-head .lg img { width: 100%; height: 100%; object-fit: cover; }
.coin-head h1 { margin: 0; font-size: 32px; font-weight: 600; letter-spacing: -.02em; }
.coin-head h1 small { font: 500 14px var(--mono); color: var(--muted); margin-left: 8px; }
.coin-head .links { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
.lk { display: inline-flex; align-items: center; gap: 7px; height: 34px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--border); font-size: 13px; font-weight: 500; }
.lk:hover { background: var(--card); }
.lk img { width: 16px; height: 16px; border-radius: 4px; }
.chart { border-radius: 16px; overflow: hidden; border: 1px solid var(--line); background: var(--card); height: 460px; }
.chart iframe { width: 100%; height: 100%; border: 0; }
.chart .wait { height: 100%; display: grid; place-items: center; text-align: center; color: var(--fg45); padding: 24px; }
.split { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 24px; align-items: start; }
.kv { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 14px; color: var(--fg7); }
.kv:last-child { border: 0; }
.kv b { color: var(--fg); font-weight: 600; text-align: right; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.pill-state { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; background: rgba(255, 255, 255, .06); color: var(--fg7); }
.pill-state.ok { background: rgba(0, 186, 124, .12); color: #3ddc97; }
.pill-state.wait { background: rgba(255, 210, 54, .1); color: var(--warn); }
.pill-state i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.claim-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.big-num { font-size: 44px; font-weight: 500; letter-spacing: -.03em; font-variant-numeric: tabular-nums; margin: 6px 0 2px; }
.siri-page { max-width: 760px; margin: 0 auto; padding-top: 12px; }

/* ---------------------------------------------------------------- the project's own coin: CA pill, hero row, live card */
.ca-top { display: none; align-items: center; gap: 8px; height: 36px; padding: 0 12px; border-radius: 999px; border: 1px solid rgba(247, 249, 249, .12); font-size: 13px; color: var(--fg7); white-space: nowrap; transition: background .15s, color .15s; }
.ca-top:hover { background: var(--card); color: var(--fg); }
.ca-top b { color: var(--fg); font-weight: 600; }
.ca-top .mono { font-size: 12px; }
.ca-top svg { width: 14px; height: 14px; }
@media (min-width: 1280px) { .ca-top:not([hidden]) { display: inline-flex; } }
.ca-row { margin: 22px auto 0; display: flex; justify-content: center; align-items: center; gap: 8px; max-width: 100%; flex-wrap: wrap; }
.ca-copy { display: inline-flex; align-items: center; gap: 10px; min-width: 0; max-width: 100%; height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--border); background: var(--card2); color: var(--fg7); font-size: 13px; transition: background .15s, color .15s; }
.ca-copy:hover { background: var(--card); color: var(--fg); }
.ca-copy b { color: var(--fg); font-weight: 600; flex: none; }
.ca-copy .mono { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12.5px; }
.ca-copy svg { width: 14px; height: 14px; flex: none; }
.ca-row .ca-copy { flex: 0 1 auto; }
.ca-lk { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--border); display: grid; place-items: center; color: var(--fg7); flex: none; transition: background .15s, color .15s; }
.ca-lk:hover { background: var(--card); color: var(--fg); }
.ca-lk img { width: 20px; height: 20px; }
.ca-lk svg { width: 18px; height: 18px; }
.live-coin { margin-top: 12px; display: grid; grid-template-columns: 400px minmax(0, 1fr); border-radius: 16px; border: 1px solid var(--line); background: var(--card); overflow: hidden; min-height: 360px; }
.lc-info { padding: 22px; display: flex; flex-direction: column; gap: 16px; border-right: 1px solid var(--line); min-width: 0; }
.lc-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.lc-logo { width: 52px; height: 52px; border-radius: 12px; background: #000; object-fit: cover; flex: none; box-shadow: inset 0 0 0 1px var(--line); }
.lc-head b { display: block; font-size: 20px; font-weight: 700; letter-spacing: -.01em; }

      if (r.status === 409 && /refund/.test(j.status || '')) { forget(id); fail('expired', j.error || 'This launch was refunded.', { id }); }

  }
  async function finish(id, sig, step, mint) {

  async function launch(f, onStep) {

    step('resize', { name: v.image.name || '', size: v.image.size, type: v.image.type || '' });
    const img = await prepImage(v.image);
    step('prepare', { size: img.size, type: img.type });
    const fd = new FormData();
    fd.append('image', img, img.name || 'coin.png');
    fd.append('name', v.name); fd.append('symbol', v.symbol); fd.append('description', v.description);
    fd.append('twitter', v.twitter); fd.append('telegram', v.telegram); fd.append('website', v.website);
    fd.append('devBuy', String(v.devBuy)); fd.append('to', v.to); fd.append('toKey', v.toKey); fd.append('toName', v.toName); fd.append('siri', v.siri); if (v.split) fd.append('split', JSON.stringify(v.split)); fd.append('wallet', wallet);
    let p = await api('/api/launch/prepare', { method: 'POST', body: fd });
    if (p.status === 0) { await wait(1500); p = await api('/api/launch/prepare', { method: 'POST', body: fd }); }
    if (!p.ok) fail(p.status === 400 || p.status === 413 ? 'invalid' : p.status === 429 ? 'rate' : p.status === 0 ? 'network' : 'launch', p.j.error || 'The launch could not start. Try again.', p.j.field ? { field: p.j.field } : undefined);
    const j = p.j;
    if (W.address !== wallet) fail('needWallet', 'The wallet changed. Start the launch again.');
    const bal = await rpc('getBalance', [wallet, { commitment: 'confirmed' }]).then(r => r && r.value).catch(() => null);
    if (typeof bal === 'number' && bal < j.lamports + PAY_FEE) fail('funds', `Not enough SOL: this launch costs ${fmt(j.lamports)} SOL plus the network fee. This wallet holds ${fmt(bal)} SOL.`);
    savePend({ id: j.id, name: v.name, symbol: v.symbol, at: Date.now(), payTo: j.payTo, lamports: j.lamports, mint: j.mint || null, sig: null, wallet });
    step('sign', { id: j.id, payTo: j.payTo, lamports: j.lamports, sol: j.sol, mint: j.mint || null, message: j.message || '' });

  async function resume(onStep) { const p = loadPend().find(x => x.sig); if (!p) return null; return finish(p.id, p.sig, stepper(onStep), p.mint); }
  async function retry(id, onStep) {
    const step = stepper(onStep);
    if (!ID.test(String(id || ''))) fail('invalid', 'Unknown launch.', { field: 'id' });
    if (!isWeb) fail('offline', 'Open the site from its web address to finish a launch.');
    const p = loadPend().find(x => x.id === id) || null;
    step('create', { id, sig: (p && p.sig) || null, mint: (p && p.mint) || null });

  async function coins() { const r = await api('/api/coins'); if (!r.ok) httpFail(r, 'network', 'The coins did not load.'); return Array.isArray(r.j.coins) ? r.j.coins : []; }

  const num = v => { const n = Number(v); return v != null && v !== '' && Number.isFinite(n) ? n : null; };
  async function market(mints) {
    const list = [...new Set((Array.isArray(mints) ? mints : [mints]).map(m => String(m || '')).filter(m => ADDR.test(m)))], out = new Map();
    const liq = p => num(p.liquidity && p.liquidity.usd) || 0, vol = p => num(p.volume && p.volume.h24) || 0;

      '<div class="ap-coin__txt"><div class="ap-coin__name">' + esc(c.name) + '<span>$' + esc(c.ticker) + '</span></div>' +
      '<div class="ap-coin__to">Fees to ' + esc(c.label) + ' ' + ICON.pay +
        (c.x ? '<span class="ap-coin__link">' + ICON.x + '@' + esc(handleOf(c.x)) + '</span>' : '') + '</div></div>' +
      '<span class="ap-faceid">' + ICON.face + 'Confirm</span></div>';
  }

  // the conversation plays when it scrolls into view and loops while visible; older lines scroll up and fade
  function playTalk(box, still) {
    if (!box) return;
    var rows = Array.prototype.slice.call(box.querySelectorAll('.ap-talk__row'));
    var timers = [], running = false;
    function showAll() { rows.forEach(function (r) { r.classList.add('is-in'); }); }
    if (still || (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches)) { showAll(); return; }
    function reset() { timers.forEach(clearTimeout); timers = []; rows.forEach(function (r) { r.classList.remove('is-in'); }); }
    function run() {
      reset(); running = true;
      var t = 350;
      rows.forEach(function (r, i) {
        if (i) t += r.classList.contains('ap-talk__row--card') ? 900 : (r.classList.contains('ap-talk__row--you') ? 1150 : 900);
        timers.push(setTimeout(function () { r.classList.add('is-in'); }, t));
      });
      timers.push(setTimeout(function () { if (running) run(); }, t + 5200));
    }
    if (!('IntersectionObserver' in window)) { run(); return; }
    new IntersectionObserver(function (es) {
      es.forEach(function (e) { if (e.isIntersecting && !running) run(); else if (!e.isIntersecting && running) { running = false; reset(); } });
    }, { threshold: 0.35 }).observe(box);
  }

  /* ---------- the Siri sheet ---------- */
  var sheet, body, recog, F = null, seq = 0, opener = null;

  function openSheet(html, kind) {
    if (!sheet) {
      sheet = document.createElement('div');
      sheet.className = 'ap-siri-sheet';
      sheet.setAttribute('role', 'dialog'); sheet.setAttribute('aria-modal', 'true'); sheet.setAttribute('aria-label', 'Siri');
      sheet.innerHTML = '<div class="ap-siri-sheet__panel">' + EDGE + '<div class="ap-siri-sheet__body"></div></div>';
      document.body.appendChild(sheet);
      body = sheet.querySelector('.ap-siri-sheet__body');
      sheet.addEventListener('click', function (e) { if (e.target === sheet) closeSheet(); });
      document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && sheet.classList.contains('is-open')) closeSheet(); });
    }
    body.innerHTML = html;
    sheet.setAttribute('data-kind', kind || 'info');
    state('idle');
    var x = body.querySelector('[data-x]'); if (x) x.onclick = closeSheet;
    if (!sheet.classList.contains('is-open')) {
      opener = document.activeElement && document.activeElement !== document.body ? document.activeElement : null;
      requestAnimationFrame(function () { sheet.classList.add('is-open'); });
    }
    setTimeout(function () {                       // keyboard focus moves into the sheet
      if (sheet.classList.contains('is-open') && !sheet.contains(document.activeElement) && x) { try { x.focus({ preventScroll: true }); } catch (e) { /* silent */ } }
    }, 80);
    return body;
  }
  // every way of closing goes through closeSheet (F = null), so F + a flow sheet = open or opening
  function isFlowOpen() { return !!(F && sheet && sheet.getAttribute('data-kind') === 'flow'); }
  function closeSheet() {
    stopRecog(); F = null;
    var wasOpen = !!(sheet && sheet.classList.contains('is-open'));
    if (sheet) sheet.classList.remove('is-open');
    try { if (window.speechSynthesis) speechSynthesis.cancel(); } catch (e) { /* silent */ }
    if (wasOpen && opener && document.contains(opener)) { try { opener.focus({ preventScroll: true }); } catch (e) { /* silent */ } }
    opener = null;
  }
  function q(sel) { return body ? body.querySelector(sel) : null; }
  function set(key, text) { var e = q('[data-' + key + ']'); if (e) { e.textContent = text || ''; e.hidden = !text; } }
  function tool(sel, on) { var e = q(sel); if (e) e.classList.toggle('is-off', !on); }
  function state(s) {
    if (!sheet) return;
    sheet.setAttribute('data-state', s);
    var orb = sheet.querySelector('.ap-orb--sheet'); if (orb) orb.classList.toggle('is-live', s === 'listening');
  }
  function pulse() {
    var e = sheet && sheet.querySelector('.ap-edge');
    if (e && e.animate) try { e.animate([{ filter: 'brightness(1.45)' }, { filter: 'brightness(1)' }], { duration: 460, easing: 'ease-out' }); } catch (x) { /* silent */ }
  }

  function pickVoice() {
    var vs = window.speechSynthesis ? speechSynthesis.getVoices() : [];
    return vs.filter(function (x) { return /^(Samantha|Siri|Ava|Allison|Google US English)/i.test(x.name) && /^en/i.test(x.lang); })[0] ||
           vs.filter(function (x) { return /^en-US/i.test(x.lang); })[0] || null;
  }
  // Siri's voice; cb runs when the line is said (or after a fallback delay when speech synthesis stays silent)
  function speak(text, cb) {
    var done = false, timer;
    function fin() { if (done) return; done = true; clearTimeout(timer); if (cb) setTimeout(cb, 220); }
    timer = setTimeout(fin, Math.min(8000, 1200 + String(text || '').length * 60));
    try {
      if (!text || cfg.quiet || !window.speechSynthesis || !window.SpeechSynthesisUtterance) { clearTimeout(timer); timer = setTimeout(fin, 200); return; }
      speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(text), v = pickVoice();
      if (v) u.voice = v;
      u.lang = 'en-US'; u.rate = 1.03;
      u.onend = fin; u.onerror = fin;
      speechSynthesis.speak(u);
    } catch (e) { fin(); }
  }

  /* ---------- Add to Siri ---------- */
  function addToSiri() {
    if (!cfg.shortcutUrl) return;
    var url = abs(cfg.shortcutUrl);
    if (isIOS()) { location.href = url; return; }
    stopRecog(); F = null;
    var b = openSheet('<button class="ap-siri-x" type="button" data-x aria-label="Close">' + ICON.close + '</button>' +
      '<div class="ap-siri-stack"><p class="ap-siri-say">Add it on your iPhone</p>' +
      '<div class="ap-siri-sheet__qr" aria-label="QR code"></div>' +
      '<p class="ap-siri-hint">Scan with the iPhone camera, tap Add Shortcut, then say “Hey Siri, launch a coin”.</p>' +
      '<div class="ap-siri-cta"><a class="ap-btn ap-btn--line" href="' + esc(url) + '">Download for Mac</a>' +
      '<button class="ap-btn ap-btn--white" type="button" data-ok>Done</button></div></div>', 'info');
    b.querySelector('[data-ok]').onclick = closeSheet;
    qr(url, b.querySelector('.ap-siri-sheet__qr'));
  }

  function qr(text, box) {
    function draw() {
      var c = window.qrcode(0, 'M'); c.addData(text); c.make();
      box.innerHTML = c.createSvgTag({ cellSize: 4, margin: 0, scalable: true });
    }
    if (window.qrcode) return draw();
    var s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js';
    s.onload = draw;
    s.onerror = function () { box.outerHTML = '<p class="ap-siri-hint">' + esc(text) + '</p>'; };
    document.head.appendChild(s);
  }

  /* ---------- "Say it here": the same questions as the Shortcut, or one sentence ---------- */
  function blank() { var f = {}; FIELDS.forEach(function (k) { f[k] = ''; }); return f; }
  function newFlow(o) {
    o = o || {};
    return { id: ++seq, i: 0, mode: speechCtor() && !o.type ? 'voice' : 'type', f: blank(), st: {}, tries: 0, heard: false, src: 'voice' };
  }

  function flowShell() {
    return '<button class="ap-siri-x" type="button" data-x aria-label="Close">' + ICON.close + '</button>' +
      '<div class="ap-siri-stack">' +
        '<div class="ap-siri-snip" data-snip hidden></div>' +
        '<p class="ap-siri-say" data-say aria-live="polite" hidden></p>' +
        '<p class="ap-siri-you" data-you hidden></p>' +
        '<p class="ap-siri-hint" data-hint hidden></p>' +
        '<div class="ap-siri-chips" data-chips aria-hidden="true"></div>' +
        '<div class="ap-siri-cta" data-cta hidden></div>' +
      '</div>' +
      '<form class="ap-siri-type" data-typeform hidden novalidate><input data-type type="text" autocomplete="off" autocapitalize="sentences" spellcheck="false" enterkeyhint="send" aria-label="Type to Siri">' +
        '<button type="submit" aria-label="Send">' + ICON.send + '</button></form>' +
      '<div class="ap-siri-bar" data-bar>' +
        '<button class="ap-siri-tool" type="button" data-mode></button>' +
        '<button class="ap-siri-orbbtn" type="button" data-orb aria-label="Talk to Siri">' + ORB_SHEET + '</button>' +
        '<button class="ap-siri-tool" type="button" data-skip>Skip</button>' +
      '</div>';
  }

  function wire() {
    q('[data-orb]').onclick = function () {
      if (!F || F.i < 0) return;
      if (F.mode === 'type') { if (speechCtor()) { F.mode = 'voice'; modeUi(); capture(); } return; }
      if (!recog) capture();
    };
    q('[data-mode]').onclick = function () {
      if (!F || F.i < 0) return;
      if (F.mode === 'voice') { stopRecog(); F.mode = 'type'; }
      else if (speechCtor()) F.mode = 'voice';
      modeUi(); capture();
    };
    q('[data-skip]').onclick = function () { if (F && F.i > 0) { stopRecog(); answer('skip'); } };
    var inp = q('[data-type]');
    q('[data-typeform]').onsubmit = function (e) {
      e.preventDefault();
      var v = inp.value.trim();
      if (!v || !F || F.i < 0) return;
      inp.value = '';
      answer(v);
    };
  }

  function modeUi() {
    if (!F) return;
    var typing = F.mode === 'type', can = !!speechCtor(), m = q('[data-mode]');
    m.innerHTML = typing ? ICON.mic + '<span>Speak</span>' : ICON.kb + '<span>Type</span>';
    tool('[data-mode]', F.i >= 0 && (!typing || can));
    q('[data-typeform]').hidden = !typing || F.i < 0;
    sheet.classList.toggle('is-typing', typing);
  }

  function chips() {
    var box = q('[data-chips]');
    if (!box || !F) return;
    box.innerHTML = STEPS.map(function (s, i) {
      var st = F.st[s.k] || (i === F.i ? 'now' : '');
      return '<span class="ap-siri-chip' + (st ? ' is-' + st : '') + '">' + esc(s.chip) + '</span>';
    }).join('');
  }

  function listen(o) {
    o = o || {};
    if (o.quiet != null) cfg.quiet = !!o.quiet;
    stopRecog();
    F = newFlow(o);
    openSheet(flowShell(), 'flow');
    wire();
    ask(0);
  }

  // Siri asks question i (line/hint override it when Siri has to ask again)
  function ask(i, line, hint) {
    if (!F) return;
    var s = STEPS[i], id = F.id;
    F.i = i;
    stopRecog();
    q('[data-snip]').hidden = true; q('[data-cta]').hidden = true;
    set('say', line || s.ask);
    set('you', '');
    set('hint', hint || s.hint);
    chips();
    var inp = q('[data-type]'); if (inp) inp.placeholder = s.ph;
    tool('[data-skip]', i > 0);
    modeUi();
    if (F.mode === 'type') { capture(); return; }      // typing is quiet, like Type to Siri
    // like Siri, the first question is shown, not said: the mic starts inside the tap that opened the sheet
    // (iPhone Safari asks for the microphone only from a tap); later questions are spoken first
    if (i === 0 && !line) { capture(); return; }
    state('speaking');
    speak(line || s.tts || s.ask, function () { if (F && F.id === id && F.i === i) capture(); });
  }

  function capture() {
    if (!F || F.i < 0) return;
    if (F.mode === 'voice' && speechCtor()) { hear(); return; }
    state('idle');
    var inp = q('[data-type]');
    if (inp) setTimeout(function () { try { inp.focus({ preventScroll: true }); } catch (e) { inp.focus(); } }, 40);
  }

  function stopRecog() { var r = recog; recog = null; try { if (r) r.abort(); } catch (e) { /* silent */ } }

  function hear() {
    var Ctor = speechCtor();
    stopRecog();
    if (!Ctor || !F) return;
    var r = new Ctor(), id = F.id, step = F.i, finalText = '', lastText = '', err = '';
    recog = r;
    r.lang = 'en-US'; r.interimResults = true; r.maxAlternatives = 1; r.continuous = false;
    state('listening');
    r.onresult = function (e) {
      if (recog !== r) return;
      var fin = '', all = '';
      for (var k = 0; k < e.results.length; k++) { var t = e.results[k][0].transcript; all += t; if (e.results[k].isFinal) fin += t; }
      finalText = fin; lastText = all;
      if (F) F.heard = true;
      set('you', '“' + all.trim() + '”');
      pulse();
    };
    r.onerror = function (e) { if (recog === r) err = e.error || 'error'; };
    r.onend = function () {
      if (recog !== r) return;
      recog = null;
      if (!F || F.id !== id || F.i !== step) return;
      var t = (finalText || lastText).trim();
      if (t) { state('thinking'); answer(t); return; }
      state('idle');
      if (err === 'not-allowed' || err === 'service-not-allowed') {
        if (F.heard) { set('hint', 'Tap the orb to answer.'); return; }       // a later question needs a tap first
        F.mode = 'type'; modeUi(); set('hint', 'Microphone access is off. Type it instead.'); capture(); return;
      }
      set('hint', err && err !== 'no-speech' && err !== 'aborted' ? 'I missed that. Tap the orb to try again, or type it.' : 'I didn’t hear anything. Tap the orb to talk.');
    };
    try { r.start(); } catch (e) { recog = null; state('idle'); set('hint', 'Tap the orb to talk.'); }
  }

  function answer(text) {
    if (!F || F.i < 0) return;
    var s = STEPS[F.i], t = String(text || '').trim();
    if (!t) return;
    set('you', '“' + t + '”');
    if (s.k === 'name') {
      var r = parse(t);
      if (!r.name || isSkipWord(r.name)) {
        F.tries++;
        ask(0, F.tries > 1 ? 'Say the coin’s name.' : 'I didn’t catch the name.', 'The name is the one thing Siri needs. ' + STEPS[0].hint);
        return;
      }
      F.tries = 0;
      FIELDS.forEach(function (k) { if (r[k]) { F.f[k] = r[k]; F.st[k] = 'set'; } });
      F.st.name = 'set';
      if (r.more) {                                  // the whole launch in one sentence: ask only who gets the fees
        FIELDS.forEach(function (k) { if (k !== 'to' && !F.st[k]) F.st[k] = 'skip'; });
        if (F.f.to) send(); else ask(TO);
        return;
      }
      ask(1);
      return;
    }
    if (s.k === 'to') {
      F.f.to = isSkipWord(t) || isDoneWord(t) ? '' : t;
      F.st.to = F.f.to ? 'set' : 'skip';
      send();
      return;
    }
    if (isDoneWord(t)) {                             // "that's all": straight to who gets the fees
      for (var j = F.i; j < TO; j++) if (!F.st[STEPS[j].k]) F.st[STEPS[j].k] = 'skip';
      ask(TO);
      return;
    }
    var skip = isSkipWord(t);
    F.f[s.k] = skip ? '' : t;
    F.st[s.k] = skip ? 'skip' : 'set';
    ask(F.i + 1);
  }

  function send() { if (F) submit(F.f); }

  // prepares the draft on the server; submit(name, to) or submit({ name, ticker, picture, description, x, telegram, website, to })
  function submit(a, to) {
    var f = a && typeof a === 'object' ? a : { name: a || '', to: to || '' };
    if (!isFlowOpen()) { stopRecog(); F = newFlow({}); openSheet(flowShell(), 'flow'); wire(); }
    var id = F.id;
    F.i = -1; F.f = f;
    stopRecog();
    state('thinking');
    set('say', 'Preparing ' + (f.name || 'your coin') + '…');
    set('you', '');
    set('hint', f.picture ? 'Making the picture and checking the links.' : 'Making the coin picture and checking who gets the fees.');
    chips();
    tool('[data-skip]', false); tool('[data-mode]', false); q('[data-typeform]').hidden = true;
    var payload = { client: 'web-voice' };
    FIELDS.forEach(function (k) { payload[k] = String(f[k] == null ? '' : f[k]).trim(); });
    fetch(cfg.api + '/api/siri/draft', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        if (!j || !j.ok) throw new Error((j && j.say) || 'Could not prepare the launch.');
        return getDraft(j.id).then(function (d) { if (!F || F.id !== id) return; d.say = j.say || d.say; ready(d, true); });
      })
      .catch(function (e) { if (F && F.id === id) failed(e.message); });
  }

  function failed(msg) {
    F.i = -1;
    state('error');
    q('[data-snip]').hidden = true;
    set('say', 'That didn’t work.'); set('you', ''); set('hint', msg);
    q('[data-chips]').innerHTML = '';
    tool('[data-skip]', false); tool('[data-mode]', false); q('[data-typeform]').hidden = true;
    var cta = q('[data-cta]');
    cta.innerHTML = '<button class="ap-btn ap-btn--white" type="button" data-again>Try again</button>';
    cta.hidden = false;
    cta.querySelector('[data-again]').onclick = function () { listen(); };
  }

  function getDraft(id) {
    return fetch(cfg.api + '/api/siri/draft/' + encodeURIComponent(id)).then(function (r) { return r.json(); }).then(function (d) {
      if (!d || !d.ok) throw new Error('This Siri launch expired. Say it again.');
      return d;
    });
  }

  function https(v) { v = String(v || ''); return /^https:\/\/\S+$/.test(v) ? v : ''; }
  // the exact shape the site's launch form reads
  function toPrefill(d, source) {
    return {
      source: source,
      draftId: d.id,
      name: d.name,
      ticker: d.ticker,
      imageUrl: d.image || null,
      description: d.description || '',
      twitter: https(d.x),
      telegram: https(d.telegram),
      website: https(d.website),
      recipient: d.recipientFull || { kind: 'unresolved' }
    };
  }

  function handoff(pre) {
    var ev = new CustomEvent('applexdrop:prefill', { detail: pre, cancelable: true });
    if (!window.dispatchEvent(ev)) return true;                 // a listener took it (preventDefault)
    var api = window.APPLEXDROP;
    if (api && typeof api.openLaunch === 'function') { api.openLaunch(pre); return true; }
    return false;
  }

  function linkChip(href, icon, label) {
    return '<a class="ap-chip" href="' + esc(href) + '" target="_blank" rel="noopener noreferrer">' + icon + '<span>' + esc(label) + '</span></a>';
  }

  // the Siri snippet: what ApplexDrop prepared, like an app's card in a Siri answer
  function snippet(d) {
    var r = d.recipient || { kind: 'unresolved', label: 'Someone', spoken: '' };
    var pic = d.image ? '<span class="ap-snip__pic" style="background-image:url(' + esc(d.image) + ')"></span>'
                      : '<span class="ap-snip__pic ap-snip__pic--none">' + esc((d.name || '?').charAt(0)) + '</span>';
    var links = [];
    if (https(d.x)) links.push(linkChip(d.x, ICON.x, '@' + handleOf(d.x)));
    if (https(d.telegram)) links.push(linkChip(d.telegram, ICON.tg, d.telegram.replace(/^https:\/\//, '')));
    if (https(d.website)) links.push(linkChip(d.website, ICON.web, d.website.replace(/^https:\/\/(www\.)?/, '').replace(/\/$/, '')));
    var notes = [];
    var missed = (d.notes || []).map(function (k) { return NOTE[k]; }).filter(Boolean);
    if (missed.length) notes.push(andList(missed) + ' not caught. Add ' + (missed.length > 1 ? 'them' : 'it') + ' on the next screen.');
    if (!d.image) notes.push('Add the coin picture on the next screen.');
    var who = r.kind === 'self' ? 'Your Apple Pay' : r.kind === 'contact' ? r.label : (r.spoken ? r.spoken : 'Pick on the next screen');
    var said = /^\+?\d|@/.test(who || '');          // a spoken number or email is its own label: no masked copy under it
    var fromShortcut = !!(F && F.src === 'siri');   // only the Shortcut searched the contacts
    var sub = r.kind === 'contact' ? (said ? '' : (r.phone || r.email || '')) :
      r.kind === 'unresolved' ? (r.spoken ? (fromShortcut ? 'Not in your contacts' : 'Needs a number or email') : 'Nobody picked yet') : '';
    return '<div class="ap-snip__head"><span>ApplexDrop</span><span>Ready to launch</span></div>' +
      '<div class="ap-snip__coin">' + pic + '<div class="ap-snip__id"><b>' + esc(d.name) + '</b><span>$' + esc(d.ticker) + '</span></div></div>' +
      (d.description ? '<p class="ap-snip__desc">' + esc(d.description) + '</p>' : '') +
      (links.length ? '<div class="ap-snip__links">' + links.join('') + '</div>' : '') +
      notes.map(function (n) { return '<p class="ap-snip__note">' + esc(n) + '</p>'; }).join('') +
      '<div class="ap-snip__to"><span class="ap-snip__lbl">Creator fees</span>' +
        '<span class="ap-snip__who"><b>' + esc(who) + '</b>' + (sub ? '<small>' + esc(sub) + '</small>' : '') + '</span>' + ICON.pay + '</div>';
  }

  // the draft is ready: Siri says the line, the snippet shows it, Continue hands it to the launch dialog
  function ready(d, speakIt, src) {
    if (!isFlowOpen()) { stopRecog(); F = newFlow({}); openSheet(flowShell(), 'flow'); wire(); }
    F.i = -1; F.d = d;
    if (src) F.src = src;
    stopRecog();
    var line = d.say || (d.name + ' is ready.');
    var at = line.indexOf('is ready'), cut = at >= 0 ? line.indexOf('. ', at) : -1;
    state('ready');
    set('say', cut > 0 ? line.slice(0, cut + 1) : line);
    set('you', '');
    set('hint', cut > 0 ? line.slice(cut + 2) : '');
    q('[data-chips]').innerHTML = '';
    var sn = q('[data-snip]'); sn.innerHTML = snippet(d); sn.hidden = false;
    q('[data-typeform]').hidden = true; tool('[data-skip]', false); tool('[data-mode]', false);
    var cta = q('[data-cta]');
    cta.innerHTML = '<button class="ap-btn ap-btn--white" type="button" data-go>' + ICON.face + 'Continue to launch</button>' +
      '<button class="ap-btn ap-btn--line" type="button" data-again>Start over</button>';
    cta.hidden = false;
    cta.querySelector('[data-go]').onclick = function () { if (handoff(toPrefill(d, (F && F.src) || 'voice'))) closeSheet(); };
    cta.querySelector('[data-again]').onclick = function () { listen(); };
    if (speakIt && F.mode === 'voice') speak(line);
  }

  /* ---------- one sentence -> fields ---------- */
  // "launch Moon Cat, ticker MOON, picture a cat on the moon, X mooncat, website mooncat dot com, fees to Mom"
  var MARKS = [
    ['to', /(?:\b(?:send|give|route|pay|direct)\s+)?(?:\b(?:the|all|my|its)\s+)?(?:\bcreator\s+)?\b(?:fees?|payouts?)\s+(?:(?:go(?:es|ing)?|should\s+go|will\s+go)\s+)?(?:to|for)\b(?![-'])/gi],
    ['ticker', /\b(?:ticker\s+symbol|ticker|symbol)\b(?![-'])/gi],
    ['picture', /\b(?:picture|image|photo|logo|pfp|avatar)\b(?![-'])/gi],
    ['description', /\b(?:description|described\s+as|bio)\b(?![-'])/gi],
    ['x', /\b(?:x|twitter)(?:\s+(?:handle|account))?\b(?![-'])(?!\s*(?:\.|dot\b))/gi],
    ['telegram', /\b(?:telegram|tg)(?:\s+(?:group|channel|chat))?\b(?![-'])(?!\s*(?:\.|dot\b))/gi],
    ['website', /\b(?:website|web\s+site|web\s?page|homepage|url)\b(?![-'])/gi]
  ];
  var TAIL_P = /[\s,.;:!?–—-]+$/;
  var TAIL_W = /\s+(?:and|with|plus|also|then|using|set|make|use|add|having|has|have|is|the|its|it's|my|our|their|his|her)$/i;
  var TAIL_A = /\s+(?:with|and|plus|using)\s+(?:a|an)$/i;
  var LEAD = /^[\s,.;:=–—-]*(?:(?:is|are|of|as|should\s+be|will\s+be|would\s+be|set\s+to|to\s+be)\s+)?(?:[:=]\s*)?/i;
  var LAUNCH = /^(?:please\s+)?(?:launch|create|make|start|deploy)\s+(?:me\s+)?(?:a\s+|an\s+)?(?:new\s+)?(?:coin|token|memecoin)?\s*(?:called|named)?\s*/i;

  // a field's words without the glue around them ("and the", "is", commas); last = nothing follows it
  function tidy(v, last, lead) {
    var t = ' ' + String(v || '');
    for (var n = 0; n < 8; n++) {
      var u = t.replace(TAIL_P, '');
      if (!last) u = u.replace(TAIL_A, '').replace(TAIL_W, '');
      if (u === t) break;
      t = u;
    }
    return (lead === false ? t : t.replace(LEAD, '')).trim();
  }
  function nameOf(v, last) {
    return tidy(v, last, false).replace(LAUNCH, '').replace(/^(?:a\s+)?(?:coin|token)\s+(?:called|named)\s+/i, '').trim();
  }

  function parse(text) {
    var src = String(text || '').replace(/[’‘]/g, "'").replace(/\s+/g, ' ').trim().replace(/^(?:hey|hi|ok|okay)\s+siri[,!.\s]*/i, '');
    var hits = [];

      var re = m[1], h;
      re.lastIndex = 0;
      while ((h = re.exec(src))) { hits.push({ k: m[0], i: h.index, e: h.index + h[0].length, w: h[0] }); if (!h[0]) re.lastIndex++; }
    });
    hits.sort(function (a, b) { return a.i - b.i || b.e - a.e; });
    var marks = [], end = 0;
    hits.forEach(function (h) { if (h.i >= end) { marks.push(h); end = h.e; } });
    var segs = [], cur = { k: 'name', w: '', s: 0 };
    marks.forEach(function (h) { cur.v = src.slice(cur.s, h.i); segs.push(cur); cur = { k: h.k, w: h.w, s: h.e }; });
    cur.v = src.slice(cur.s); segs.push(cur);
    // a marker with nothing after it, or a field said twice, belongs to the words before it ("Space X", "fees to Malcolm X")
    var out = [segs[0]], used = { name: true }, n;
    for (n = 1; n < segs.length; n++) {
      var g = segs[n];
      if (used[g.k] || !tidy(g.v, n === segs.length - 1)) { out[out.length - 1].v += g.w + g.v; continue; }
      used[g.k] = true; out.push(g);
    }
    var name = nameOf(out[0].v, out.length === 1);
    if (!name && out.length > 1 && /^(?:picture|x|telegram|website)$/.test(out[1].k)) {   // "Picture Perfect, ticker PIC"
      out[0].v += out[1].w + out[1].v; out.splice(1, 1);
      name = nameOf(out[0].v, out.length === 1);
    }
    var r = blank();
    r.more = out.length > 1;
    for (n = 1; n < out.length; n++) r[out[n].k] = tidy(out[n].v, n === out.length - 1).slice(0, 300);
    if (!r.more) {                                   // typed "Moon Cat, +1 415 555 0134"
      var m2 = name.match(/^(.+?)\s*,\s*(.+)$/);
      if (m2) { name = m2[1]; r.to = m2[2]; r.more = true; }
    }
    r.name = name.replace(/[.!?]+$/, '').trim().slice(0, 32);
    return r;
  }

  /* ---------- ?siri=<draft> from the Shortcut ---------- */
  function prefill() {
    var id;
    try { id = new URLSearchParams(location.search).get('siri'); } catch (e) { return; }
    if (!id || !/^[A-Za-z0-9]{10}$/.test(id)) return;

      if (!handoff(toPrefill(d, 'siri'))) ready(d, false, 'siri');

        '<div class="ap-siri-stack"><p class="ap-siri-say">This Siri launch expired</p><p class="ap-siri-hint">' + esc(e.message) + '</p>' +
        '<div class="ap-siri-cta"><button class="ap-btn ap-btn--white" type="button" data-ok>OK</button></div></div>', 'info');
      b.querySelector('[data-ok]').onclick = closeSheet;
    });
  }

  window.ApplexDropSiri = { mount: mount, prefill: prefill, listen: listen, parse: parse, submit: submit, close: closeSheet, steps: STEPS };
})();

  // ---------------------------------------------------------------- docs
  function docs(v) {
    const T = [['overview', 'Overview'], ['launch', 'Launching'], ['recipient', 'Who gets paid'], ['payouts', 'Payouts'], ['fees', 'Fees'], ['siri', 'Siri'], ['privacy', 'Privacy and safety'], ['api', 'API']];

      <h2 id="overview">Overview</h2><p>ApplexDrop is a launchpad on Solana. You launch a pump.fun coin and name a person by the phone number or email of their Apple Pay. Every creator fee the coin earns is booked to that person and sent to their Apple Cash.</p>
      <h2 id="launch">Launching</h2><ul><li>Connect a Solana wallet (Phantom, Solflare, Backpack or any Wallet Standard wallet).</li><li>Add the image, name, ticker and the recipient's Apple Pay number or email. Socials and a dev buy are optional.</li><li>You sign one SOL transfer: the launch fee plus your dev buy. It goes to a new wallet made for this coin.</li><li>That wallet creates the coin on pump.fun, so it is the coin's creator on-chain and pump.fun pays the creator fees to it. Dev buy tokens are sent to your wallet.</li><li>If the create does not land, the launch is tried again; you can also ask for a refund of the coin wallet's SOL.</li></ul>
      <h2 id="recipient">Who gets paid</h2><p>Any phone number or email that has Apple Cash. A 10-digit number is read as a US number (+1). You can add a name, like "Mom"; it is shown on ApplexDrop and in the coin's description. The number or email itself is never shown: pages use a mask like <code>+1 ••• 42</code>.</p>
      <h2 id="payouts">Payouts</h2><p>Apple has no public payout API. So the ApplexDrop treasury sends Apple Cash to the recipient's number or email, from its own Apple Cash, as fees add up. Money sent to that number or email can only reach its owner, so the recipient does not claim anything.</p><p>Apple Cash is US-only. A recipient without it can ask for SOL on <a href="/claim">Claim Fees</a>: we confirm with them on that number or email, then the SOL in their coins' wallets is sent to the wallet they named.</p>
      <h2 id="fees">Fees</h2><table><tr><th>What</th><th>Amount</th></tr><tr><td>Launch fee</td><td><span id="d-fee">0.035</span> SOL, once</td></tr><tr><td>Creator fees</td><td>100% to the recipient</td></tr><tr><td>Dev buy</td><td>optional, up to <span id="d-dev">5</span> SOL, +5% for pump.fun fees and slippage</td></tr></table>
      <h2 id="siri">Siri</h2><p>"Hey Siri, launch a coin" asks for the name and who gets the fees, finds that person in your contacts, and opens the launch in your wallet already filled in. You confirm with Face ID. If the contact does not match what you said, ApplexDrop asks for the number instead of guessing. See <a href="/siri">Siri</a>.</p>
      <h2 id="privacy">Privacy and safety</h2><ul><li>Phone numbers and emails are kept only to send Apple Cash. Public pages and the API show the name and the mask.</li><li>A coin's recipient does not mean that person endorses the coin.</li><li>ApplexDrop holds each coin wallet's key (sealed) so it can collect fees and pay them out. ApplexDrop is not made by or affiliated with Apple.</li></ul>
      <h2 id="api">API</h2><p><code>GET /api/book</code> coins, recipients and payments · <code>GET /api/coin/&lt;mint&gt;</code> · <code>GET /api/payee/&lt;key&gt;</code> · <code>GET /api/config</code></p>
    </article></div></div>`;

    const s = q.value.trim(); if (!s) { closeTA(); return; }
    const b = await book(), low = s.toLowerCase(), rows = [];
    if (AP.normContact(s)) rows.push(`<a href="/claim" data-claim="1"><span class="ini" style="width:36px;height:36px;font-size:13px">${appleSvg.replace('<svg', '<svg style="width:15px;height:18px"')}</span><span>Check the fees of this ${s.includes('@') ? 'email' : 'number'}<small>Claim Fees</small></span></a>`);
    b.coins.filter(c => (c.name + ' ' + c.symbol + ' ' + c.mint).toLowerCase().includes(low)).slice(0, 6).forEach(c => rows.push(`<a href="/token/${esc(c.mint)}">${logoImg(c, '')}<span>${esc(c.name)} <span class="mono" style="color:var(--muted);font-size:12px">${esc(c.symbol)}</span><small>to ${esc(who(c.to))}</small></span></a>`));
    b.payees.filter(p => (p.label + ' ' + p.mask).toLowerCase().includes(low)).slice(0, 3).forEach(p => rows.push(`<a href="/to/${esc(p.key)}">${ini(p)}<span>${esc(who(p))}<small>${esc(p.mask)} · ${p.tokens} tokens</small></span></a>`));
    ta.innerHTML = rows.join('') || `<p>No coin or payee matches "${esc(s)}".</p>`; ta.classList.add('on'); q.setAttribute('aria-expanded', 'true'); hydrate(ta);
  });
  ta.addEventListener('click', e => { const a = e.target.closest('a'); if (a && a.dataset.claim) SS.set('ap:claim', q.value.trim()); setTimeout(() => { closeTA(); q.value = ''; }, 0); });
  q.addEventListener('keydown', e => { if (e.key === 'Enter') { const a = $('a', ta); if (a) a.click(); } });
  document.addEventListener('click', e => { if (!e.target.closest('.search-box')) closeTA(); });

  // ---------------------------------------------------------------- rail, menu
  const rail = $('#rail'); if (LSx.get('ap:mini') === '1') rail.classList.add('mini');
  $('#collapse').onclick = () => { rail.classList.toggle('mini'); LSx.set('ap:mini', rail.classList.contains('mini') ? '1' : null); };
  $('#menu-btn').onclick = () => $('#mmenu').classList.add('on');
  $('#mmenu').addEventListener('click', e => { if (e.target.id === 'mmenu' || e.target.closest('a')) $('#mmenu').classList.remove('on'); });
  if (CFG.x) { const a = $('#acct'); a.href = 'https://x.com/' + CFG.x; a.target = '_blank'; a.rel = 'noopener'; $('#acct-sub').textContent = '@' + CFG.x; }
  else { const x = $('#acct .x'); if (x) x.remove(); }

  // ---------------------------------------------------------------- Siri hand-off, unfinished launches, boot
  window.APPLEXDROP = { openLaunch(pre) { LF.pre = pre || null; if (location.pathname === '/launch') render(); else go('/launch'); } };
  addEventListener('applexdrop:prefill', e => { e.preventDefault(); window.APPLEXDROP.openLaunch(e.detail); });
  render(); walletUi();
  AP.ready.then(() => {
    walletUi();
    const p = AP.pending().find(x => x.sig);
    if (p) { toast(`Finishing your launch of $${p.symbol}…`, 5000); AP.resume().then(out => { if (out) { toast(`$${p.symbol} is live.`, 5000); book(true).then(() => { if (location.pathname === '/') render(); }); } }).catch(e => toast(e.message, 6000)); }
  });
  if (window.ApplexDropSiri) window.ApplexDropSiri.prefill();
  setInterval(() => { if (document.visibilityState === 'visible' && /^\/($|explore|payments|analytics)/.test(location.pathname)) book(true); }, 30000);
})();

</script>
